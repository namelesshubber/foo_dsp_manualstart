name: Build foo_dsp_manualstart

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache the SDK archive
        uses: actions/cache@v4
        with:
          path: sdk.7z
          key: fb2k-sdk-2025-03-07

      - name: Download and prepare the foobar2000 SDK
        shell: pwsh
        run: |
          if (-not (Test-Path sdk.7z)) {
            $urls = @(
              'https://www.foobar2000.org/files/SDK-2025-03-07.7z',
              'https://foobar2000.org/files/SDK-2025-03-07.7z',
              'https://web.archive.org/web/2025id_/https://www.foobar2000.org/files/SDK-2025-03-07.7z'
            )
            $ok = $false
            foreach ($url in $urls) {
              for ($i = 1; $i -le 5 -and -not $ok; $i++) {
                Write-Host "Download ($i/5): $url"
                curl.exe -L --fail --connect-timeout 20 -o sdk.7z $url
                if ($LASTEXITCODE -eq 0 -and (Test-Path sdk.7z) -and (Get-Item sdk.7z).Length -gt 100000) {
                  $ok = $true
                } else {
                  Start-Sleep -Seconds (10 * $i)
                }
              }
              if ($ok) { break }
            }
            if (-not $ok) { throw "SDK download failed" }
          }
          7z x sdk.7z -osdk -y | Out-Null

          $pfc = Get-ChildItem -Path sdk -Recurse -Filter pfc.vcxproj | Select-Object -First 1
          if (-not $pfc) { throw "pfc.vcxproj not found in the SDK" }
          $sdkRoot = $pfc.Directory.Parent.FullName
          Write-Host "SDK root: $sdkRoot"
          "SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

          Copy-Item -Path foo_dsp_manualstart -Destination "$sdkRoot\foo_dsp_manualstart" -Recurse

          # The SDK projects default to /MD: rebuild everything with /MT (static C
          # runtime) so the DLL does not need the Visual C++ redistributable.
          $xml = '<Project><ItemDefinitionGroup><ClCompile><RuntimeLibrary>MultiThreaded</RuntimeLibrary></ClCompile></ItemDefinitionGroup></Project>'
          Set-Content -Path "$sdkRoot\Directory.Build.targets" -Value $xml -Encoding utf8

          $libs = Get-ChildItem "$sdkRoot\foobar2000\shared" -Filter *.lib
          $libs | ForEach-Object { Write-Host "Found lib: $($_.FullName)" }
          if ("${{ matrix.platform }}" -eq "x64") {
            $lib = $libs | Where-Object { $_.Name -match 'x64' -and $_.Name -notmatch 'arm' } | Select-Object -First 1
          } else {
            $lib = $libs | Where-Object { $_.Name -match 'Win32|x86' } | Select-Object -First 1
            if (-not $lib) {
              $lib = $libs | Where-Object { $_.Name -eq 'shared.lib' } | Select-Object -First 1
            }
          }
          if (-not $lib) { throw "shared library not found for ${{ matrix.platform }}" }
          Write-Host "Using: $($lib.FullName)"
          "SHARED_LIB=$($lib.FullName)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          msbuild "$env:SDK_ROOT\foo_dsp_manualstart\foo_dsp_manualstart.vcxproj" `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /p:SharedLib="$env:SHARED_LIB" `
            /m /v:minimal

      - name: Verify the DLL
        shell: pwsh
        run: |
          $dll = "$env:SDK_ROOT\foo_dsp_manualstart\out\${{ matrix.platform }}\foo_dsp_manualstart.dll"
          if (-not (Test-Path $dll)) { throw "DLL not produced: $dll" }
          $exports = dumpbin /exports $dll | Out-String
          Write-Host $exports
          if ($exports -notmatch 'foobar2000_get_interface') { throw "Missing export foobar2000_get_interface" }
          dumpbin /dependents $dll
          Copy-Item $dll "foo_dsp_manualstart.dll"

      - name: Upload the DLL
        uses: actions/upload-artifact@v4
        with:
          name: foo_dsp_manualstart-${{ matrix.platform }}
          path: foo_dsp_manualstart.dll
